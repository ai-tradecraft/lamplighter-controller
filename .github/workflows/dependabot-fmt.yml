# Dependabot modifies files with no end line and that breaks the pre-commit checks. This adds the missing lines.
name: Format Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  fix-newlines:
    # Only run for pull requests opened by Dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Check out the Dependabot branch directly
          ref: ${{ github.event.pull_request.head.ref }}
          # Use a GitHub token to allow commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Missing Newlines
        run: |
          # Finds files and appends a newline if the last line has no trailing line feed
          find . -type f -not -path '*/.*' | while read -r file; do
            if [ -f "$file" ] && [ "$(tail -c1 "$file" | wc -l)" -eq 0 ]; then
              echo "" >> "$file"
              echo "Added trailing newline to $file"
            fi
          done

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: add missing trailing newline [dependabot skip]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

